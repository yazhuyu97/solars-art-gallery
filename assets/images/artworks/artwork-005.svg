<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF5EE" />
      <stop offset="60%" stop-color="#D9ECE0" />
      <stop offset="100%" stop-color="#C2DEC9" />
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#mintGrad)" />

  <!-- Glasshouse Arch -->
  <path d="M 180,680 L 180,380 C 180,240 620,240 620,380 L 620,680 Z" fill="none" stroke="#688B73" stroke-width="6" opacity="0.6" />
  <path d="M 280,680 L 280,410 C 280,310 520,310 520,410 L 520,680 Z" fill="none" stroke="#688B73" stroke-width="4" opacity="0.5" />
  <line x1="400" y1="240" x2="400" y2="680" stroke="#688B73" stroke-width="4" opacity="0.5" />
  <line x1="180" y1="460" x2="620" y2="460" stroke="#688B73" stroke-width="4" opacity="0.4" />
  <line x1="180" y1="580" x2="620" y2="580" stroke="#688B73" stroke-width="4" opacity="0.4" />

  <!-- Monstera and Tropical Foliage -->
  <g transform="translate(240, 680)">
    <!-- Palm fronds -->
    <path d="M0,0 Q-80,-120 -150,-100 Q-70,-60 0,0" fill="#4B7757" opacity="0.8" />
    <path d="M0,0 Q-40,-150 -60,-220 Q-10,-120 0,0" fill="#588565" opacity="0.85" />
    <path d="M0,0 Q60,-170 120,-200 Q40,-110 0,0" fill="#699676" opacity="0.8" />
  </g>
  <g transform="translate(560, 690)">
    <path d="M0,0 Q80,-120 150,-100 Q70,-60 0,0" fill="#4B7757" opacity="0.8" />
    <path d="M0,0 Q40,-160 80,-230 Q20,-120 0,0" fill="#588565" opacity="0.85" />
    <path d="M0,0 Q-50,-150 -100,-190 Q-30,-100 0,0" fill="#699676" opacity="0.8" />
  </g>

  <!-- Big Central Monstera Leaf -->
  <g transform="translate(400, 650)">
    <ellipse cx="0" cy="-60" rx="90" ry="120" fill="#3A6345" opacity="0.9" />
    <path d="M0,60 L0,-170" stroke="#87A990" stroke-width="4" stroke-linecap="round" />
  </g>

  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#B8D4BF" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
  <text x="400" y="910" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="20" fill="#2E5437" letter-spacing="4">綠意溫室</text>
  <text x="400" y="935" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#587E62" letter-spacing="3">DIGITAL CONCEPT ART</text>
</svg>