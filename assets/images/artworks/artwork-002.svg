<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF4F0" />
      <stop offset="40%" stop-color="#E2EBE4" />
      <stop offset="100%" stop-color="#D5DFD7" />
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#mistGrad)" />

  <!-- Mountain Silhouettes -->
  <path d="M-100,560 Q150,420 380,510 T850,480 L850,1050 L-100,1050 Z" fill="#9FB5A3" opacity="0.45" />
  <path d="M-50,660 Q200,530 450,620 T900,590 L900,1050 L-50,1050 Z" fill="#7E9683" opacity="0.6" />
  <path d="M-50,780 Q280,680 520,740 T900,710 L900,1050 L-50,1050 Z" fill="#5F7664" opacity="0.75" />

  <!-- Pine Tree Silhouettes -->
  <g transform="translate(260, 480)" opacity="0.85">
    <path d="M0,280 L0,50" stroke="#3D4D41" stroke-width="8" stroke-linecap="round" />
    <path d="M0,50 L-40,110 L-25,110 L-55,170 L-35,170 L-70,230 L70,230 L35,170 L55,170 L25,110 L40,110 Z" fill="#4B6050" />
  </g>
  <g transform="translate(180, 550)" opacity="0.7">
    <path d="M0,220 L0,40" stroke="#3D4D41" stroke-width="7" stroke-linecap="round" />
    <path d="M0,40 L-35,90 L-20,90 L-45,140 L-30,140 L-60,190 L60,190 L30,140 L45,140 L20,90 L35,90 Z" fill="#5A7160" />
  </g>

  <!-- Soft Fog Swirls -->
  <path d="M -50,620 Q 200,640 500,600 T 850,630" fill="none" stroke="#FFFFFF" stroke-width="35" opacity="0.35" filter="blur(8px)" />
  <path d="M -50,740 Q 300,710 650,750 T 900,720" fill="none" stroke="#FFFFFF" stroke-width="25" opacity="0.3" filter="blur(6px)" />

  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#C8D4CA" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
  <text x="400" y="910" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="20" fill="#516455" letter-spacing="4">雨後松風</text>
  <text x="400" y="935" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7C9281" letter-spacing="3">TRADITIONAL INK & WASH</text>
</svg>