<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7D5E8" />
      <stop offset="35%" stop-color="#F2D5CE" />
      <stop offset="70%" stop-color="#F9E2BE" />
      <stop offset="100%" stop-color="#F5CBA7" />
    </linearGradient>
    <radialGradient id="sunDisk" cx="50%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="50%" stop-color="#FCE1BE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F9E2BE" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sunsetSky)" />

  <!-- Setting Sun -->
  <circle cx="400" cy="550" r="140" fill="url(#sunDisk)" />
  <circle cx="400" cy="550" r="70" fill="#FFFBF0" opacity="0.95" />

  <!-- Distant Birds -->
  <g fill="none" stroke="#665360" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
    <path d="M 280,380 Q 290,372 300,380 Q 310,372 320,380" />
    <path d="M 330,350 Q 338,343 346,350 Q 354,343 362,350" />
    <path d="M 250,410 Q 257,404 264,410 Q 271,404 278,410" />
  </g>

  <!-- Power Lines / Minimalist Street Silhouette -->
  <path d="M -50,580 Q 400,660 850,600" fill="none" stroke="#68555E" stroke-width="2" opacity="0.5" />
  <path d="M -50,610 Q 400,690 850,630" fill="none" stroke="#68555E" stroke-width="2" opacity="0.5" />

  <!-- Gentle hills silhouette -->
  <path d="M -50,720 Q 250,660 500,710 T 850,680 L 850,1050 L -50,1050 Z" fill="#6B596A" opacity="0.85" />
  <path d="M -50,810 Q 350,760 620,800 T 850,780 L 850,1050 L -50,1050 Z" fill="#4B3D4B" opacity="0.95" />

  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#D1BFCB" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
  <text x="400" y="910" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="20" fill="#4E3B4C" letter-spacing="4">晚霞歸途</text>
  <text x="400" y="935" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7D657B" letter-spacing="3">DIGITAL SPEED PAINTING</text>
</svg>