<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EE" />
      <stop offset="50%" stop-color="#F4ECE0" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#warmBg)" />

  <!-- Table surface -->
  <path d="M0,680 L800,680 L800,1000 L0,1000 Z" fill="#E4D7C5" opacity="0.8" />
  <line x1="0" y1="680" x2="800" y2="680" stroke="#D1C1AC" stroke-width="2" />

  <!-- Ceramic Vase -->
  <g transform="translate(320, 430)">
    <path d="M 40,250 C 0,250 -30,220 -40,170 C -50,110 -15,70 -10,30 L 70,30 C 75,70 110,110 100,170 C 90,220 60,250 40,250 Z" fill="#D9C2AA" />
    <ellipse cx="30" cy="30" rx="40" ry="10" fill="#C5AE95" />
    <!-- Dried Flower Stems -->
    <path d="M 30,30 Q 10,-80 50,-180" fill="none" stroke="#7A6652" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="-180" r="16" fill="#CBB59B" />
    <path d="M 30,30 Q -30,-60 -80,-140" fill="none" stroke="#7A6652" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-80" cy="-140" r="14" fill="#D7C3AA" />
  </g>

  <!-- Lemons -->
  <g transform="translate(480, 670)">
    <ellipse cx="0" cy="0" rx="58" ry="42" transform="rotate(-15)" fill="#F5DA73" />
    <ellipse cx="-48" cy="12" rx="10" ry="6" transform="rotate(-20)" fill="#E8C956" />
    <ellipse cx="48" cy="-12" rx="10" ry="6" transform="rotate(-20)" fill="#E8C956" />
    <ellipse cx="6" cy="-4" rx="35" ry="22" fill="#FBF098" opacity="0.6" />
  </g>
  <g transform="translate(240, 710)">
    <ellipse cx="0" cy="0" rx="52" ry="38" transform="rotate(25)" fill="#F2D365" />
    <ellipse cx="4" cy="-6" rx="30" ry="20" fill="#FDF3B0" opacity="0.6" />
  </g>

  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#D8C8B5" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
  <text x="400" y="910" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="20" fill="#6B5945" letter-spacing="4">靜物與檸檬</text>
  <text x="400" y="935" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#99836D" letter-spacing="3">TRADITIONAL ACRYLIC</text>
</svg>